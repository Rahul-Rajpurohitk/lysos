<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121a"/>
      <stop offset="1" stop-color="#0a1d27"/>
    </linearGradient>
    <linearGradient id="gpuShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2230"/>
      <stop offset="1" stop-color="#0a1820"/>
    </linearGradient>
    <linearGradient id="genShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#003c43"/>
      <stop offset="1" stop-color="#001f23"/>
    </linearGradient>
    <linearGradient id="embShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15364a"/>
      <stop offset="1" stop-color="#0a2030"/>
    </linearGradient>
    <linearGradient id="rlShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1635"/>
      <stop offset="1" stop-color="#1d0a1c"/>
    </linearGradient>
    <linearGradient id="ragShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c12"/>
      <stop offset="1" stop-color="#0d1709"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e6b9"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="62" font-family="JetBrains Mono, ui-monospace, monospace" font-size="34" font-weight="700" fill="#e6f7f3">LYSOS — architecture</text>
  <text x="60" y="92" font-size="18" fill="#7da5a0">Generative drug designer for AMR · Gemma 4 31B + EmbeddingGemma · single AMD MI300X (192 GB)</text>

  <!-- watermark / brand mark -->
  <g transform="translate(1490,55)">
    <rect x="-8" y="-26" width="100" height="34" rx="6" fill="#00e6b9" opacity="0.12"/>
    <text x="42" y="-3" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#00e6b9" text-anchor="middle">LYSOS v1</text>
  </g>

  <!-- ====================== TRAINING PIPELINE (top) ====================== -->
  <text x="60" y="160" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2" fill="#56cbb6" font-weight="600">TRAINING PIPELINE — 3 STAGES</text>

  <!-- Stage 1 -->
  <g>
    <rect x="60" y="180" width="320" height="120" rx="8" fill="#0c2030" stroke="#1f4458" stroke-width="1.2"/>
    <text x="80" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#56cbb6" letter-spacing="2">STAGE 1</text>
    <text x="80" y="240" font-size="20" fill="#e6f7f3" font-weight="700">TxGemma-4 base</text>
    <text x="80" y="266" font-size="14" fill="#a3c2bd">Therapeutics Data Commons</text>
    <text x="80" y="284" font-size="14" fill="#a3c2bd">~50 ADMET / binding tasks · LoRA SFT</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="430" y="180" width="320" height="120" rx="8" fill="#0c2030" stroke="#1f4458" stroke-width="1.2"/>
    <text x="450" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#56cbb6" letter-spacing="2">STAGE 2</text>
    <text x="450" y="240" font-size="20" fill="#e6f7f3" font-weight="700">AMR specialization</text>
    <text x="450" y="266" font-size="14" fill="#a3c2bd">222,606 instructions · ChEMBL +</text>
    <text x="450" y="284" font-size="14" fill="#a3c2bd">DBAASP + DRAMP + DrugBank + CARD</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="800" y="180" width="320" height="120" rx="8" fill="#0c2030" stroke="#5a2540" stroke-width="1.2"/>
    <text x="820" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#e066a8" letter-spacing="2">STAGE 3 — RL</text>
    <text x="820" y="240" font-size="20" fill="#e6f7f3" font-weight="700">GRPO + verifiable rewards</text>
    <text x="820" y="266" font-size="14" fill="#a3c2bd">3,200 prompts · 6-component</text>
    <text x="820" y="284" font-size="14" fill="#a3c2bd">composite reward</text>
  </g>

  <!-- arrows between stages -->
  <line x1="380" y1="240" x2="430" y2="240" stroke="#00e6b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="240" x2="800" y2="240" stroke="#00e6b9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- final model output -->
  <g>
    <rect x="1170" y="180" width="370" height="120" rx="8" fill="#0c2030" stroke="#00e6b9" stroke-width="1.6"/>
    <text x="1190" y="210" font-family="JetBrains Mono, monospace" font-size="13" fill="#00e6b9" letter-spacing="2">OUTPUT</text>
    <text x="1190" y="240" font-size="20" fill="#e6f7f3" font-weight="700">rahul24raj/lysos-rl</text>
    <text x="1190" y="266" font-size="14" fill="#a3c2bd">Open weights · Apache-2.0</text>
    <text x="1190" y="284" font-size="14" fill="#a3c2bd">deployed to HF Space + workspace</text>
  </g>
  <line x1="1120" y1="240" x2="1170" y2="240" stroke="#00e6b9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====================== MI300X GPU BOX ====================== -->
  <g transform="translate(60,360)">
    <!-- GPU frame -->
    <rect x="0" y="0" width="1480" height="480" rx="14" fill="url(#gpuShade)" stroke="#274858" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="1480" height="48" rx="14" fill="#000000" opacity="0.35"/>
    <rect x="0" y="36" width="1480" height="12" fill="#000000" opacity="0.35"/>
    <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#00e6b9">AMD INSTINCT MI300X · 192 GB HBM3 · ROCm 6.x</text>
    <text x="1456" y="32" font-family="JetBrains Mono, monospace" font-size="14" fill="#56cbb6" text-anchor="end">single GPU · coresident</text>

    <!-- ============ INFERENCE PATH: gemma 4 generator ============ -->
    <g>
      <rect x="50" y="80" width="380" height="180" rx="10" fill="url(#genShade)" stroke="#00e6b9" stroke-width="1.6"/>
      <text x="70" y="108" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#00e6b9">GENERATOR</text>
      <text x="70" y="140" font-size="22" font-weight="700" fill="#e6f7f3">Gemma 4 31B-it</text>
      <text x="70" y="166" font-size="14" fill="#a3c2bd">33B dense · multimodal</text>
      <text x="70" y="186" font-size="14" fill="#a3c2bd">FP16 weights · 62 GB</text>
      <text x="70" y="208" font-size="14" fill="#a3c2bd">vLLM serving · ROCm</text>

      <!-- token-stream visual -->
      <rect x="70" y="225" width="340" height="22" rx="3" fill="#001114"/>
      <rect x="70" y="225" width="234" height="22" rx="3" fill="#00e6b9" opacity="0.55"/>
      <text x="240" y="241" font-family="JetBrains Mono, monospace" font-size="11" fill="#001114" text-anchor="middle">tokens out · 60+ tok/s</text>
    </g>

    <!-- ============ EMBEDDER ============ -->
    <g>
      <rect x="460" y="80" width="320" height="180" rx="10" fill="url(#embShade)" stroke="#3a86c0" stroke-width="1.6"/>
      <text x="480" y="108" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#5fa6da">EMBEDDER</text>
      <text x="480" y="140" font-size="22" font-weight="700" fill="#e6f7f3">EmbeddingGemma 300m</text>
      <text x="480" y="166" font-size="14" fill="#a3c2bd">Gemma 3 architecture</text>
      <text x="480" y="186" font-size="14" fill="#a3c2bd">Matryoshka 768→128</text>
      <text x="480" y="208" font-size="14" fill="#a3c2bd">FP16 · ~1 GB · 2K context</text>

      <!-- vector grid -->
      <g transform="translate(480,228)">
        <rect width="14" height="14" fill="#3a86c0" opacity="0.85"/>
        <rect x="18" width="14" height="14" fill="#3a86c0" opacity="0.65"/>
        <rect x="36" width="14" height="14" fill="#3a86c0" opacity="0.45"/>
        <rect x="54" width="14" height="14" fill="#3a86c0" opacity="0.85"/>
        <rect x="72" width="14" height="14" fill="#3a86c0" opacity="0.55"/>
        <rect x="90" width="14" height="14" fill="#3a86c0" opacity="0.30"/>
        <rect x="108" width="14" height="14" fill="#3a86c0" opacity="0.70"/>
        <rect x="126" width="14" height="14" fill="#3a86c0" opacity="0.90"/>
        <text x="170" y="12" font-family="JetBrains Mono, monospace" font-size="11" fill="#a3c2bd">vector ∈ ℝ⁷⁶⁸</text>
      </g>
    </g>

    <!-- ============ RAG INDEX ============ -->
    <g>
      <rect x="810" y="80" width="320" height="180" rx="10" fill="url(#ragShade)" stroke="#88c552" stroke-width="1.6"/>
      <text x="830" y="108" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#9bd76a">RAG / NOVELTY INDEX</text>
      <text x="830" y="140" font-size="22" font-weight="700" fill="#e6f7f3">Known antibiotics</text>
      <text x="830" y="166" font-size="14" fill="#a3c2bd">ChEMBL + DBAASP + DRAMP</text>
      <text x="830" y="186" font-size="14" fill="#a3c2bd">20,489 rows · cosine search</text>
      <text x="830" y="208" font-size="14" fill="#a3c2bd">RAG · novelty · similar drugs</text>

      <!-- mini bar chart of similarity -->
      <g transform="translate(830,225)">
        <rect width="70" height="6" fill="#88c552" opacity="0.95"/>
        <rect y="10" width="55" height="6" fill="#88c552" opacity="0.75"/>
        <rect y="20" width="42" height="6" fill="#88c552" opacity="0.55"/>
        <text x="200" y="20" font-family="JetBrains Mono, monospace" font-size="11" fill="#a3c2bd">top-5 cosine hits</text>
      </g>
    </g>

    <!-- ============ TRAINING (RL) BLOCK ============ -->
    <g>
      <rect x="1160" y="80" width="280" height="180" rx="10" fill="url(#rlShade)" stroke="#e066a8" stroke-width="1.6"/>
      <text x="1180" y="108" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#f08fc4">RL TRAIN STATE</text>
      <text x="1180" y="138" font-size="20" font-weight="700" fill="#e6f7f3">GRPO peak ≈ 152 GB</text>
      <text x="1180" y="166" font-size="13" fill="#f5cce0">policy + ref + reward</text>
      <text x="1180" y="186" font-size="13" fill="#f5cce0">+ KV-cache + grads</text>
      <text x="1180" y="216" font-size="12" fill="#a3c2bd">H100 80 GB busts → must shard</text>
      <text x="1180" y="234" font-size="12" fill="#a3c2bd">MI300X 192 GB fits whole stack</text>
    </g>

    <!-- ============ MEMORY BUDGET BAR ============ -->
    <g transform="translate(50,300)">
      <text x="0" y="-6" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#56cbb6">MEMORY BUDGET — 192 GB HBM3</text>
      <rect x="0" y="0" width="1390" height="38" rx="4" fill="#001114" stroke="#1f4458"/>
      <!-- gen 62 -->
      <rect x="0" y="0" width="448" height="38" rx="4" fill="#003c43" opacity="0.85"/>
      <text x="224" y="24" font-family="JetBrains Mono, monospace" font-size="13" fill="#7df0d4" text-anchor="middle">Gemma 4 31B · 62 GB</text>
      <!-- emb 1 -->
      <rect x="448" y="0" width="8" height="38" rx="2" fill="#15364a" opacity="0.95"/>
      <!-- ref 56 -->
      <rect x="456" y="0" width="404" height="38" fill="#3b1635" opacity="0.85"/>
      <text x="658" y="24" font-family="JetBrains Mono, monospace" font-size="13" fill="#f5cce0" text-anchor="middle">reference + reward · 56 GB</text>
      <!-- kv + grads 34 -->
      <rect x="860" y="0" width="246" height="38" fill="#274858" opacity="0.85"/>
      <text x="983" y="24" font-family="JetBrains Mono, monospace" font-size="13" fill="#a3c2bd" text-anchor="middle">KV + grads · 34 GB</text>
      <!-- headroom 40 -->
      <rect x="1106" y="0" width="284" height="38" fill="#000000" opacity="0.55"/>
      <text x="1248" y="24" font-family="JetBrains Mono, monospace" font-size="13" fill="#56cbb6" text-anchor="middle">headroom · 40 GB</text>
    </g>

    <!-- bottom labels for the bar -->
    <g transform="translate(50,344)" font-family="JetBrains Mono, monospace" font-size="10" fill="#56cbb6" letter-spacing="1">
      <text x="0" y="0">0</text>
      <text x="448" y="0">62</text>
      <text x="860" y="0">119</text>
      <text x="1106" y="0">152</text>
      <text x="1390" y="0" text-anchor="end">192 GB</text>
    </g>

    <!-- arrows between blocks (inference path) -->
    <line x1="430" y1="170" x2="460" y2="170" stroke="#00e6b9" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="780" y1="170" x2="810" y2="170" stroke="#5fa6da" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- back-flow from RAG to generator (RAG injects into prompt) -->
    <path d="M 970 220 C 970 380 200 380 200 260" fill="none" stroke="#9bd76a" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="585" y="378" font-family="JetBrains Mono, monospace" font-size="11" fill="#9bd76a" text-anchor="middle">RAG: top-k known antibiotics → in-context examples</text>
  </g>

  <!-- ====================== INPUT / OUTPUT BANDS ====================== -->
  <g>
    <text x="60" y="880" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#56cbb6">PATHOGEN-IN  →  CANDIDATE-OUT  ·  6-component reward · validity / QED / SA / MIC / hemolysis-safety / novelty (Tanimoto + semantic)</text>
  </g>
</svg>
