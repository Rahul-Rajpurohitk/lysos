version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lysos-postgres
    environment:
      POSTGRES_DB: lysos
      POSTGRES_USER: lysos
      POSTGRES_PASSWORD: lysos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lysos -d lysos"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lysos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lysos-api
    environment:
      LYSOS_DB_URL: postgresql://lysos:lysos@postgres:5432/lysos
      LYSOS_REDIS_URL: redis://redis:6379/0
      LYSOS_LLM_BACKEND: ${LYSOS_LLM_BACKEND:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data:ro
      - ../src:/app/src:ro

  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    container_name: lysos-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:7860
    depends_on:
      - api

volumes:
  postgres_data:
