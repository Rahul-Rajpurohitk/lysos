[project]
name = "lysos"
version = "0.1.0"
description = "Open-source generative drug designer for antimicrobial resistance, built on Gemma 4, RL-tuned on AMD MI300X."
authors = [
    {name = "Rahul Rajpurohit"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "drug-discovery",
    "antimicrobial-resistance",
    "gemma",
    "fine-tuning",
    "reinforcement-learning",
    "rocm",
    "amd",
    "mi300x",
    "huggingface",
    "lablab",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    # Core ML
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "datasets>=3.0.0",
    "huggingface-hub[hf_transfer]>=0.27.0",
    "tokenizers>=0.20.0",
    "safetensors>=0.4.5",
    # Embedding model — EmbeddingGemma 300m for novelty reward + RAG + dedup
    "sentence-transformers>=3.0.0",

    # Chemistry / drug discovery
    "rdkit>=2024.3.5",
    "PyTDC>=1.1.0",

    # Data manipulation
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "pyarrow>=17.0.0",

    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.9.0",
    "click>=8.1.7",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",

    # Experiment tracking
    "wandb>=0.18.0",

    # Visualization / analysis
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",

    # Serving / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
# Note: Install torch with the ROCm index URL on AMD systems:
#   pip install torch --index-url https://download.pytorch.org/whl/rocm6.2
# Adding torch here as a fallback, but the ROCm wheel is preferred.
torch = ["torch>=2.5.0"]

# AMD ROCm-specific extras — install on the AMD Dev Cloud VM:
amd = [
    "optimum-amd>=0.4.0",
]

# Optional: Boltz-2 for structure prediction
structure = [
    "boltz>=0.3.0",
]

# Dev / linting
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
    "ipython>=8.28.0",
    "jupyter>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/Rahul-Rajpurohitk/lysos"
Repository = "https://github.com/Rahul-Rajpurohitk/lysos"
Issues = "https://github.com/Rahul-Rajpurohitk/lysos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # Let formatter handle line length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
