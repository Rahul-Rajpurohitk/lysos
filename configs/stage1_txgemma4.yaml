# Stage 1 — TxGemma-4 (chemistry foundation on Gemma 4)
#
# Replicates Google's TxGemma training on Gemma 4 base, using ~50 TDC tasks
# formatted as instruction/response pairs.
#
# Targets: Large 8x MI300X for ~6-8 hours wall-clock.
# Optionally: Small 1x MI300X for ~30-40 hours.

_inherit: base.yaml

run_name: stage1-txgemma4-gemma4-31b
description: Replicate TxGemma recipe on Gemma 4 base

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
dataset:
  source: local                # or 'hub'
  path: data/processed/tdc-stage1
  hub_id: rahul24raj/lysos-tdc-stage1   # if push-to-hub set
  split_train: train
  split_eval: valid
  text_field: messages         # JSON-encoded list of {role, content}
  response_template: "<start_of_turn>model\n"   # Gemma chat template
  max_seq_length: 8192
  packing: true                # pack multiple short examples — efficiency win

# -----------------------------------------------------------------------------
# Training overrides
# -----------------------------------------------------------------------------
training:
  output_dir: ./checkpoints/stage1-txgemma4
  num_train_epochs: 2
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  warmup_ratio: 0.03
  eval_steps: 250
  save_steps: 500
  logging_steps: 25
  group_by_length: true

# -----------------------------------------------------------------------------
# PEFT — slightly bigger LoRA for foundation training
# -----------------------------------------------------------------------------
peft:
  r: 128
  alpha: 256

# -----------------------------------------------------------------------------
# Hub
# -----------------------------------------------------------------------------
hub:
  push_to_hub: true
  hub_model_id: rahul24raj/txgemma-4-31b
  push_strategy: checkpoint     # 'checkpoint' or 'end'

# -----------------------------------------------------------------------------
# Wandb
# -----------------------------------------------------------------------------
wandb:
  tags:
    - amd-mi300x
    - gemma-4
    - lablab-2026
    - stage1
    - txgemma-4
    - tdc
