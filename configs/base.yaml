# Base config — shared defaults for all training stages.
# Stage configs (stage1.yaml, stage2.yaml, stage3.yaml) override + extend this.
#
# Hierarchical loading: stage configs declare `_inherit: base.yaml` so missing
# fields fall back here.

_inherit: null

# -----------------------------------------------------------------------------
# Project identity
# -----------------------------------------------------------------------------
project:
  name: lysos
  description: Generative drug designer for antimicrobial resistance
  github: https://github.com/Rahul-Rajpurohitk/lysos
  hub_user: rahul24raj
  event_org: lablab-ai-amd-developer-hackathon

# -----------------------------------------------------------------------------
# Model defaults
# -----------------------------------------------------------------------------
model:
  base_id: google/gemma-4-31B-it
  dtype: bfloat16          # MI300X loves BF16
  attn_impl: sdpa   # via optimum-amd on ROCm
  trust_remote_code: false
  use_cache: false         # disable during training to save memory

# -----------------------------------------------------------------------------
# Tokenizer defaults
# -----------------------------------------------------------------------------
tokenizer:
  use_chat_template: true
  pad_token: "<eos>"       # Gemma pads with EOS
  truncation_side: right
  max_length: 4096

# -----------------------------------------------------------------------------
# LoRA / PEFT defaults
# -----------------------------------------------------------------------------
peft:
  enabled: true
  type: lora
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# -----------------------------------------------------------------------------
# Training defaults (overridden per-stage)
# -----------------------------------------------------------------------------
training:
  output_dir: ./checkpoints
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: adamw_torch
  max_grad_norm: 1.0
  bf16: true
  tf32: false
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  group_by_length: true
  report_to:
    - wandb
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  dataloader_num_workers: 4
  seed: 42

# -----------------------------------------------------------------------------
# Experiment tracking
# -----------------------------------------------------------------------------
wandb:
  project: lysos
  entity: null              # uses default user/team
  tags:
    - amd-mi300x
    - gemma-4
    - lablab-2026
  log_model: false          # we push to HF Hub instead

# -----------------------------------------------------------------------------
# Hub upload
# -----------------------------------------------------------------------------
hub:
  push_to_hub: true
  private: true
  token_env: HF_TOKEN
