# Stage 2 — AMR specialization (SFT on antibiotic + AMP data).
#
# Loads Stage 1 (TxGemma-4) checkpoint and continues training on
# antimicrobial-specific data: ChEMBL antibiotic subset, DBAASP/APD3/DRAMP
# antimicrobial peptides, CARD resistant pathogen targets.
#
# Targets: Small 1x MI300X for ~15-20 hours.

_inherit: base.yaml

run_name: stage2-amr-sft-lysos-base
description: AMR specialization on top of Stage 1 TxGemma-4

# -----------------------------------------------------------------------------
# Model — load from Stage 1 checkpoint
# -----------------------------------------------------------------------------
model:
  base_id: rahul24raj/txgemma-4-31b      # Stage 1 output (HF Hub)
  # If still local from Stage 1, override at CLI: --model.base_id ./checkpoints/stage1-txgemma4

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
dataset:
  # The "pro v2" Stage 2 = scaffold-aware chemistry tuples + reasoning slice:
  #   • clean-split chemistry tuples       195,616 train + 15,584 valid
  #     (scaffold split: 0 SMILES leak, 0 pair leak)
  #   • original reasoning chains            4,981 train +    207 valid
  #     (Wikipedia mechanism/indication/resistance/history,
  #      PubMed abstract Q&A, CARD resistance-gene explanations)
  #   • named-drug elite CoT                   311 train + 49 held-out test
  #     (named genes/MICs/exact trial citations across 14 reasoning task types)
  # = total 364,424 train + 29,300 valid + 49 named-drug-test
  # Versions on HF Hub:
  #   raw      → rahul24raj/lysos-amr-stage2          (leaky superset)
  #   dedup    → rahul24raj/lysos-amr-stage2-dedup    (hash dedup, leaky)
  #   clean    → rahul24raj/lysos-amr-stage2-clean    (scaffold-split, no leak)
  #   reasoning → rahul24raj/lysos-amr-stage2-reasoning (just reasoning)
  #   pro      → rahul24raj/lysos-amr-stage2-pro      (clean + reasoning, no named-drug)
  #   pro-v2   → rahul24raj/lysos-amr-stage2-pro-v2   (pro + named-drug elite CoT)
  #   pro-v3   → rahul24raj/lysos-amr-stage2-pro-v3   (DEFAULT: pro-v2 + 32 agentic gaps + safety/refusal/tool-arg/held-out-eval)
  source: local
  path: data/processed/amr-stage2-pro-v3
  hub_id: rahul24raj/lysos-amr-stage2-pro-v3
  split_train: train
  split_eval: valid
  text_field: messages
  response_template: "<start_of_turn>model\n"
  max_seq_length: 4096
  packing: true
  # Held-out eval slices baked into the dataset:
  #   • split=test (50 rows) — named-drug structural-mechanistic reasoning,
  #     never trained on; loaded by `eval_held_out.py` for canary checks.
  #   • independent named-drug-test JSONL: data/processed/amr-stage2-pro-v2/test_named_drug.jsonl (49 rows)
  # Multi-task mixing weights (sum = 1.0). Recalibrated 2026-05-03 after
  # named-drug-elite-CoT injection — total 27 task types in train.
  task_mix:
    # Core chemistry (46%) — directly serve the design objective.
    # Reduced 2pp from generation/activity to make room for elite reasoning slice.
    generation_for_target: 0.18  # given pathogen → SMILES
    activity_prediction: 0.16    # given molecule + pathogen → MIC
    peptide_design: 0.08         # given pathogen → AMP sequence
    drug_smiles: 0.02            # name → SMILES (DrugCentral)
    drug_from_smiles: 0.02       # SMILES → name (DrugCentral)

    # Safety + properties (12%)
    safety_prediction: 0.08      # given molecule → hemolysis
    drug_likeness: 0.04          # given molecule → QED + Lipinski (rdkit-side)

    # Drug + natural product knowledge (37%) — vocabulary tasks
    natural_product_origin: 0.04         # NPAtlas — name → producer organism
    natural_product_smiles: 0.03         # NPAtlas — name → SMILES
    natural_product_origin_smiles: 0.03  # NPAtlas — name → both
    drug_id_lookup: 0.05         # name → DrugBank ID  (was 0.06; 1pp redirected)
    drug_inchi_key: 0.05         # name → Standard InChI Key
    drug_synonyms: 0.05          # name → synonym list
    drug_cas_lookup: 0.06        # name → CAS
    drug_reverse_cas: 0.06       # CAS → name

    # Elite named-drug reasoning slice (5%) — high-quality CoT to develop
    # deep reasoning fingerprint. Aggressive oversample: ~720 rows are 0.2%
    # of corpus but get 5% of training compute = 25x upsample. Sub-weights
    # are proportional to per-task volume.
    drug_pathogen_reasoning: 0.020       # 280 rows · clinical reasoning
    drug_mechanism_deep_dive: 0.005      #  81 rows · target/SAR/PK/PD deep dive
    counterfactual_design: 0.004         #  53 rows · "what if remove X" SAR
    resistance_mechanism_explanation: 0.003  # 50 rows · named genes/enzymes
    drug_combination_synergy: 0.003      #  44 rows · synergy + clinical evidence
    cross_pathogen_spectrum: 0.003       #  37 rows · spectrum maps
    structure_activity_comparison: 0.002 #  36 rows · drug-pair SAR
    pathogen_specific_dive: 0.002        #  34 rows · hard-to-treat organisms
    pk_pd_reasoning: 0.002               #  32 rows · TDM / dosing scenarios
    stewardship_decision: 0.002          #  32 rows · empirical/de-escalation
    design_challenge: 0.001              #  14 rows · de novo (low weight, filter-limited)
    candidate_ranking: 0.001             #   9 rows · multi-objective triage
    reward_profile_analysis: 0.001       #   9 rows · 7-component reward profiling
    structural_strategy_reasoning: 0.001 #   9 rows · pathogen-arc analysis

# -----------------------------------------------------------------------------
# Training — gentler LR than Stage 1, fewer epochs (avoid forgetting Stage 1)
# -----------------------------------------------------------------------------
training:
  output_dir: ./checkpoints/stage2-amr-sft
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  warmup_ratio: 0.05
  eval_steps: 100
  save_steps: 200
  logging_steps: 10

# -----------------------------------------------------------------------------
# PEFT — same target modules but new LoRA, merged with Stage 1
# -----------------------------------------------------------------------------
peft:
  r: 64
  alpha: 128
  load_existing_adapter: rahul24raj/txgemma-4-31b   # merge Stage 1 first

# -----------------------------------------------------------------------------
# Hub
# -----------------------------------------------------------------------------
hub:
  push_to_hub: true
  hub_model_id: rahul24raj/lysos-base
  push_strategy: end

# -----------------------------------------------------------------------------
# Wandb
# -----------------------------------------------------------------------------
wandb:
  tags:
    - amd-mi300x
    - gemma-4
    - lablab-2026
    - stage2
    - amr
    - sft
